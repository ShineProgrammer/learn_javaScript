<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="style.css" rel="stylesheet">

<body>
    <div id="tagBar">
        <button class="tagDivMake" id="tagDivMake" onclick="tagDivMake()">New link</button>
